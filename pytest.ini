[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium, may have dependencies)
    e2e: End-to-end tests (slow, tests complete workflows)
    
# Settings
addopts = -v --strict-markers --color=yes 